name: Starmap CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  STARMAP_SECRET_KEY: "test-secret-key-for-ci"
  FLASK_ENV: "testing"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: |
          requirements.txt
          tests/requirements.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r tests/requirements.txt

    - name: Lint with flake8
      run: |
        # Stop build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings. GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Type checking with mypy
      run: |
        mypy app_refactored.py auth.py --ignore-missing-imports --no-strict-optional --explicit-package-bases
      # Advisory for now: the route blueprints carry known type debt
      continue-on-error: true

    - name: Build SQLite database
      run: python scripts/migrate_to_sqlite.py

    - name: Run unit tests with pytest
      run: python -m pytest tests/ -q --junit-xml=test-results.xml --cov=. --cov-report=xml --cov-report=html

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      if: matrix.python-version == '3.12'
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Archive test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-py${{ matrix.python-version }}
        path: |
          test-results.xml
          htmlcov/
        retention-days: 30
        if-no-files-found: ignore

  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build SQLite database
      run: python scripts/migrate_to_sqlite.py

    - name: Start application
      run: |
        python app_refactored.py > server.log 2>&1 &
        echo $! > app.pid

        echo "Waiting for application to start..."
        for i in {1..30}; do
          if curl -f -s http://localhost:8080/health >/dev/null 2>&1; then
            echo "Application is ready!"
            break
          fi
          echo "Waiting... ($i/30)"
          sleep 1
        done

        if ! curl -f -s http://localhost:8080/health >/dev/null 2>&1; then
          echo "Application failed to start properly"
          cat server.log
          exit 1
        fi

    - name: Smoke-test API endpoints
      run: |
        set -e
        curl -f -s http://localhost:8080/health | python -m json.tool
        curl -f -s http://localhost:8080/api/v1/stats >/dev/null
        curl -f -s http://localhost:8080/api/v1/nations >/dev/null
        curl -f -s "http://localhost:8080/api/v1/stars?count_limit=5" >/dev/null
        echo "All smoke checks passed"

    - name: Show server log on failure
      if: failure()
      run: cat server.log || true

    - name: Stop application
      if: always()
      run: |
        if [ -f app.pid ]; then
          kill "$(cat app.pid)" 2>/dev/null || true
          sleep 2
          kill -9 "$(cat app.pid)" 2>/dev/null || true
        fi
        pkill -f "python app_refactored.py" || true

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit[toml] safety

    - name: Run security checks with bandit
      run: |
        bandit -r . -f json -o bandit-report.json || true
        bandit -r . || true

    - name: Run safety check for dependencies
      run: |
        safety check --json --output safety-report.json || true
        safety check || true

    - name: Upload security reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json
        retention-days: 30
        if-no-files-found: ignore

  build-release:
    runs-on: ubuntu-latest
    needs: [test, smoke-test, security]
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Create release package
      run: |
        mkdir -p release/starmap-v${{ github.run_number }}
        cp -r app_refactored.py auth.py app/ models/ scripts/ static/ templates/ data/ tests/ requirements.txt LICENSE release/starmap-v${{ github.run_number }}/

        # Create startup scripts
        cat > release/starmap-v${{ github.run_number }}/start.sh << 'EOF'
        #!/bin/bash
        echo "Installing dependencies..."
        pip install -r requirements.txt --quiet
        if [ ! -f data/starmap.sqlite ]; then
          echo "Building SQLite database..."
          python scripts/migrate_to_sqlite.py
        fi
        echo "Starting Starmap..."
        python app_refactored.py
        EOF
        chmod +x release/starmap-v${{ github.run_number }}/start.sh

        # Create Windows script
        cat > release/starmap-v${{ github.run_number }}/start.bat << 'EOF'
        @echo off
        echo Installing dependencies...
        pip install -r requirements.txt --quiet
        if not exist data\starmap.sqlite (
          echo Building SQLite database...
          python scripts\migrate_to_sqlite.py
        )
        echo Starting Starmap...
        python app_refactored.py
        EOF

        # Create ZIP package
        cd release
        zip -r starmap-felgenland-saga-v${{ github.run_number }}.zip starmap-v${{ github.run_number }}/

    - name: Upload release artifact
      uses: actions/upload-artifact@v4
      with:
        name: starmap-release-v${{ github.run_number }}
        path: release/starmap-felgenland-saga-v${{ github.run_number }}.zip
        retention-days: 90
        compression-level: 6
