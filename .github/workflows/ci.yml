name: Starmap CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  STARMAP_SECRET_KEY: "test-secret-key-for-ci"
  FLASK_ENV: "testing"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/tests/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r tests/requirements.txt
    
    - name: Lint with flake8
      run: |
        # Stop build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings. GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Type checking with mypy
      run: |
        mypy app.py auth.py --ignore-missing-imports --no-strict-optional
    
    - name: Run unit tests with pytest
      run: |
        python -m pytest tests/ \
          --cov=. \
          --cov-report=xml \
          --cov-report=html \
          --cov-report=term-missing \
          --junit-xml=test-results.xml \
          --html=test-report.html \
          --self-contained-html \
          -v
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}
        
    - name: Archive test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.os }}-py${{ matrix.python-version }}
        path: |
          test-results.xml
          test-report.html
          htmlcov/
        retention-days: 30
        if-no-files-found: ignore

  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r tests/requirements.txt
    
    - name: Start application
      run: |
        python app.py &
        APP_PID=$!
        echo "APP_PID=$APP_PID" >> $GITHUB_ENV
        
        # Wait for app to start and verify it's running
        echo "Waiting for application to start..."
        for i in {1..30}; do
          if curl -f http://localhost:8080/api/stats >/dev/null 2>&1; then
            echo "Application is ready!"
            break
          fi
          echo "Waiting... ($i/30)"
          sleep 1
        done
        
        # Final check
        if ! curl -f http://localhost:8080/api/stats >/dev/null 2>&1; then
          echo "Application failed to start properly"
          exit 1
        fi
    
    - name: Run integration tests
      run: |
        python tests/test_api_auth.py
    
    - name: Stop application
      if: always()
      run: |
        if [ ! -z "$APP_PID" ]; then
          kill $APP_PID || true
          sleep 2
          kill -9 $APP_PID 2>/dev/null || true
        fi
        # Also kill by process name as backup
        pkill -f "python app.py" || true
        
  performance-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r tests/requirements.txt
    
    - name: Run performance tests
      run: |
        python tests/test_performance.py
    
    - name: Upload performance results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: performance-results
        path: performance-*.txt
        retention-days: 30
        if-no-files-found: ignore

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r tests/requirements.txt
    
    - name: Run security checks with bandit
      run: |
        bandit -r . -f json -o bandit-report.json || true
    
    - name: Run safety check for dependencies
      run: |
        safety check --json --output safety-report.json || true
    
    - name: Upload security reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json
        retention-days: 30
        if-no-files-found: ignore

  build-release:
    runs-on: ubuntu-latest
    needs: [test, integration-test, performance-test, security]
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 30
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Create release package
      run: |
        mkdir -p release/starmap-v${{ github.run_number }}
        cp -r app.py auth.py controllers/ models/ handlers/ database/ static/ templates/ data/ tests/ requirements.txt LICENSE release/starmap-v${{ github.run_number }}/
        
        # Create startup scripts
        cat > release/starmap-v${{ github.run_number }}/start.sh << 'EOF'
        #!/bin/bash
        echo "Installing dependencies..."
        pip install -r requirements.txt --quiet
        echo "Starting Starmap..."
        python app.py
        EOF
        chmod +x release/starmap-v${{ github.run_number }}/start.sh
        
        # Create Windows script
        cat > release/starmap-v${{ github.run_number }}/start.bat << 'EOF'
        @echo off
        echo Installing dependencies...
        pip install -r requirements.txt --quiet
        echo Starting Starmap...
        python app.py
        EOF
        
        # Create ZIP package
        cd release
        zip -r starmap-felgenland-saga-v${{ github.run_number }}.zip starmap-v${{ github.run_number }}/
    
    - name: Upload release artifact
      uses: actions/upload-artifact@v4
      with:
        name: starmap-release-v${{ github.run_number }}
        path: release/starmap-felgenland-saga-v${{ github.run_number }}.zip
        retention-days: 90
        compression-level: 6