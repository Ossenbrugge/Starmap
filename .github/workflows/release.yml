name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  STARMAP_SECRET_KEY: "test-secret-key-for-release"
  FLASK_ENV: "testing"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r tests/requirements.txt

    - name: Initialize database
      run: python scripts/migrate_to_sqlite.py

    - name: Run full test suite
      run: python -m pytest tests/ -v --junit-xml=test-results.xml
      env:
        PYTHONPATH: ${{ github.workspace }}

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Create release bundle
      run: |
        mkdir -p release/starmap-${{ github.ref_name }}
        cp -r app_refactored.py auth.py app/ models/ scripts/ static/ templates/ data/ tests/ release/starmap-${{ github.ref_name }}/
        cp requirements.txt README.md LICENSE CONTRIBUTING.md release/starmap-${{ github.ref_name }}/
        tar -czf starmap-${{ github.ref_name }}.tar.gz -C release starmap-${{ github.ref_name }}

    - name: Upload release artifacts
      uses: actions/upload-artifact@v4
      with:
        name: release-bundle
        path: starmap-${{ github.ref_name }}.tar.gz

  docker:
    needs: test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Login to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: |
          starmap/starmap:latest
          starmap/starmap:${{ github.ref_name }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  github-release:
    needs: [test, build]
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Needed for changelog generation

    - name: Download release bundle
      uses: actions/download-artifact@v4
      with:
        name: release-bundle

    - name: Generate changelog
      run: |
        echo "## Changes in ${{ github.ref_name }}" > CHANGELOG.md
        echo "" >> CHANGELOG.md
        git log --oneline --pretty=format:"- %s" $(git describe --tags --abbrev=0 HEAD^)..HEAD >> CHANGELOG.md || echo "- Initial release" >> CHANGELOG.md
        echo "" >> CHANGELOG.md
        echo "## Installation" >> CHANGELOG.md
        echo "" >> CHANGELOG.md
        echo "1. Download and extract the release bundle" >> CHANGELOG.md
        echo "2. Install dependencies: \`pip install -r requirements.txt\`" >> CHANGELOG.md
        echo "3. Build the database: \`python scripts/migrate_to_sqlite.py\`" >> CHANGELOG.md
        echo "4. Start the application: \`python app_refactored.py\`" >> CHANGELOG.md
        echo "" >> CHANGELOG.md
        echo "## Docker" >> CHANGELOG.md
        echo "" >> CHANGELOG.md
        echo "\`\`\`bash" >> CHANGELOG.md
        echo "docker run -p 8080:8080 starmap/starmap:${{ github.ref_name }}" >> CHANGELOG.md
        echo "\`\`\`" >> CHANGELOG.md

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: starmap-${{ github.ref_name }}.tar.gz
        body_path: CHANGELOG.md
        draft: false
        prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    needs: [test, build, docker, github-release]
    runs-on: ubuntu-latest

    steps:
    - name: Notify success
      run: |
        echo "[SUCCESS] Release ${{ github.ref_name }} completed successfully!"
        echo "[RELEASE] GitHub Release: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
        echo "[DOCKER] Docker Image: starmap/starmap:${{ github.ref_name }}"
