name: Test Suite

# Cross-platform unit tests. The main Linux pipeline (lint, type check,
# tests on 3.10-3.12, smoke test, security scan, packaging) lives in ci.yml;
# this workflow only verifies the suite on Windows and macOS.

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  STARMAP_SECRET_KEY: "test-secret-key-for-ci"
  FLASK_ENV: "testing"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python-version: ['3.12']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: |
          requirements.txt
          tests/requirements.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -r requirements.txt
        pip install -r tests/requirements.txt

    - name: Build SQLite database
      run: python scripts/migrate_to_sqlite.py

    - name: Run unit tests
      run: python -m pytest tests/ -q --junit-xml=test-results.xml

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.os }}-py${{ matrix.python-version }}
        path: test-results*.xml
        retention-days: 30
        if-no-files-found: ignore
