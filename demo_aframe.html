<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A-Frame Starfield Demo - Felgenland Universe</title>
    
    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
    
    <style>
        body {
            margin: 0;
            background: #000;
            font-family: 'Courier New', monospace;
        }
        
        .info-panel {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: #00ff88;
            padding: 15px;
            border: 2px solid #00ff88;
            border-radius: 8px;
            z-index: 1000;
            max-width: 300px;
        }
        
        .controls-panel {
            position: fixed;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: #ffffff;
            padding: 10px;
            border: 1px solid #00ff88;
            border-radius: 5px;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <h3 style="color: #00ff88; margin-top: 0;">🌌 Felgenland Starfield</h3>
        <p><strong>Status:</strong> <span id="status">Loading...</span></p>
        <p><strong>Stars:</strong> <span id="star-count">0</span></p>
        <p><strong>View:</strong> A-Frame WebXR</p>
        <p><strong>VR Ready:</strong> ✅</p>
    </div>
    
    <div class="controls-panel">
        <strong>🎮 Controls:</strong><br>
        Mouse: Look around<br>
        WASD: Move camera<br>
        Click stars: Show details<br>
        Enter VR: Click VR button
    </div>
    
    <a-scene 
        background="color: #000011"
        vr-mode-ui="enabled: true"
        fog="type: linear; color: #0B1426; near: 50; far: 300">
        
        <!-- Assets -->
        <a-assets>
            <a-mixin id="star-base" 
                     geometry="primitive: sphere; radius: 0.1"
                     material="shader: standard; metalness: 0; roughness: 0; emissive: #ffffff; emissiveIntensity: 0.8"></a-mixin>
            <a-mixin id="fictional-star" 
                     mixin="star-base"
                     material="emissive: #00ff88; emissiveIntensity: 1.5"></a-mixin>
            <a-mixin id="terran-star" 
                     mixin="star-base"
                     material="emissive: #1565C0; emissiveIntensity: 1.2"></a-mixin>
            <a-mixin id="felgenland-star" 
                     mixin="star-base"
                     material="emissive: #4CAF50; emissiveIntensity: 1.2"></a-mixin>
        </a-assets>
        
        <!-- Camera with orbit controls -->
        <a-camera 
            position="0 0 30"
            look-controls="enabled: true"
            wasd-controls="enabled: true"
            orbit-controls="
                target: 0 0 0;
                enableDamping: true;
                dampingFactor: 0.1;
                rotateSpeed: 0.05;
                enableZoom: true;
                minDistance: 5;
                maxDistance: 200;
                enablePan: true;">
            
            <!-- VR controllers -->
            <a-entity hand-controls="hand: left" laser-controls raycaster="objects: .star"></a-entity>
            <a-entity hand-controls="hand: right" laser-controls raycaster="objects: .star"></a-entity>
        </a-camera>
        
        <!-- Lighting -->
        <a-light type="ambient" color="#404040" intensity="0.4"></a-light>
        <a-light type="directional" position="0 10 0" color="#ffffff" intensity="0.2"></a-light>
        
        <!-- Stars container -->
        <a-entity id="star-field"></a-entity>
        
        <!-- Galactic reference grid -->
        <a-entity id="reference-grid">
            <!-- Grid lines for reference -->
            <a-box position="0 0 0" width="0.2" height="0.2" depth="0.2" 
                   material="color: #ffeb3b; emissive: #ffeb3b; emissiveIntensity: 1"
                   animation="property: rotation; to: 0 360 0; loop: true; dur: 20000"></a-box>
            
            <!-- Coordinate axes -->
            <a-cylinder position="10 0 0" radius="0.05" height="20" rotation="0 0 90" 
                        material="color: #ff0000; emissive: #ff0000; emissiveIntensity: 0.5"></a-cylinder>
            <a-cylinder position="0 10 0" radius="0.05" height="20" 
                        material="color: #00ff00; emissive: #00ff00; emissiveIntensity: 0.5"></a-cylinder>
            <a-cylinder position="0 0 10" radius="0.05" height="20" rotation="90 0 0" 
                        material="color: #0000ff; emissive: #0000ff; emissiveIntensity: 0.5"></a-cylinder>
        </a-entity>
        
        <!-- Navigation text -->
        <a-text 
            id="nav-info"
            position="0 25 -30"
            value="🌌 Felgenland Starfield Demo - Loading stars from MontyDB..."
            color="#00ff88"
            align="center"
            scale="2 2 2"></a-text>
    </a-scene>
    
    <script>
        // Sample star data (simulating MontyDB response)
        const sampleStars = [
            {id: 999999, name: "Tiefe-Grenze Tor", fictional_name: "Tiefe-Grenze Tor", 
             x: -12.8, y: 7.0, z: 8.4, magnitude: 9.5, spectral_class: "G5V", 
             nation: {id: "felgenland_union", name: "Felgenland Union"}, distance: 16.86},
            {id: 0, name: "Sol", fictional_name: null, 
             x: 0, y: 0, z: 0, magnitude: -26.7, spectral_class: "G2V", 
             nation: {id: "terran_directorate", name: "Terran Directorate"}, distance: 0},
            {id: 71456, name: "Alpha Centauri A", fictional_name: null, 
             x: -1.2, y: -0.9, z: 3.7, magnitude: -0.27, spectral_class: "G2V", 
             nation: {id: "terran_directorate", name: "Terran Directorate"}, distance: 4.37},
            {id: 49767, name: "Pentothia Prime", fictional_name: "Pentothia Prime", 
             x: 8.2, y: -5.1, z: 2.8, magnitude: 6.2, spectral_class: "K1V", 
             nation: null, distance: 10.5}
        ];
        
        // Generate more sample stars
        for (let i = 0; i < 96; i++) {
            const spectralTypes = ['O', 'B', 'A', 'F', 'G', 'K', 'M'];
            const spectral = spectralTypes[Math.floor(Math.random() * spectralTypes.length)];
            
            sampleStars.push({
                id: 1000 + i,
                name: `Star-${1000 + i}`,
                fictional_name: Math.random() > 0.9 ? `Fictional-${i}` : null,
                x: (Math.random() - 0.5) * 50,
                y: (Math.random() - 0.5) * 50,
                z: (Math.random() - 0.5) * 50,
                magnitude: Math.random() * 10,
                spectral_class: spectral + Math.floor(Math.random() * 9),
                nation: Math.random() > 0.8 ? {id: "random_nation", name: "Random Nation"} : null,
                distance: Math.random() * 25
            });
        }
        
        function createStars(stars) {
            const starField = document.getElementById('star-field');
            
            stars.forEach((star, index) => {
                const starEntity = document.createElement('a-sphere');
                
                // Position
                starEntity.setAttribute('position', `${star.x} ${star.z} ${-star.y}`);
                
                // Size based on magnitude
                const size = Math.max(0.05, (8 - star.magnitude) * 0.03);
                starEntity.setAttribute('radius', size);
                
                // Color by properties
                let color = '#ffffff';
                
                if (star.fictional_name) {
                    color = '#00ff88';
                } else if (star.nation) {
                    if (star.nation.id === 'terran_directorate') {
                        color = '#1565C0';
                    } else if (star.nation.id === 'felgenland_union') {
                        color = '#4CAF50';
                    }
                } else {
                    // Spectral class colors
                    const spectral = star.spectral_class?.charAt(0) || 'G';
                    const spectralColors = {
                        'O': '#9bb0ff', 'B': '#aabfff', 'A': '#cad7ff',
                        'F': '#f8f7ff', 'G': '#fff4ea', 'K': '#ffd2a1',
                        'M': '#ffad51'
                    };
                    color = spectralColors[spectral] || '#ffffff';
                }
                
                starEntity.setAttribute('material', `
                    shader: standard;
                    metalness: 0;
                    roughness: 0;
                    emissive: ${color};
                    emissiveIntensity: ${star.fictional_name ? 1.5 : 0.8};
                `);
                
                // Interaction
                starEntity.setAttribute('class', 'star');
                starEntity.setAttribute('data-star-id', star.id);
                
                starEntity.addEventListener('click', function() {
                    showStarInfo(star);
                });
                
                starEntity.addEventListener('mouseenter', function() {
                    this.setAttribute('scale', '2 2 2');
                });
                
                starEntity.addEventListener('mouseleave', function() {
                    this.setAttribute('scale', '1 1 1');
                });
                
                starField.appendChild(starEntity);
            });
            
            // Update UI
            document.getElementById('star-count').textContent = stars.length;
            document.getElementById('status').textContent = 'Ready';
            
            const navInfo = document.getElementById('nav-info');
            navInfo.setAttribute('value', `🌌 Felgenland Starfield - ${stars.length} stars loaded - Click to explore!`);
            
            console.log(`✅ Created ${stars.length} A-Frame stars`);
        }
        
        function showStarInfo(star) {
            const info = `⭐ ${star.fictional_name || star.name} | ${star.spectral_class} | ${star.distance.toFixed(1)} pc`;
            
            const navInfo = document.getElementById('nav-info');
            navInfo.setAttribute('value', info);
            
            // Reset after 3 seconds
            setTimeout(() => {
                navInfo.setAttribute('value', '🌌 Felgenland Starfield - Click stars to explore!');
            }, 3000);
            
            console.log('Star selected:', star.fictional_name || star.name);
        }
        
        // Initialize when A-Frame is ready
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(() => {
                createStars(sampleStars);
            }, 1000);
        });
    </script>
</body>
</html>
