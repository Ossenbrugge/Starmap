[pytest]
# Pytest configuration for Starmap testing.
# The suite runs in-process (Flask test client + fixture SQLite DB);
# no live server or external database is required.

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

minversion = 7.0

addopts =
    -ra
    --tb=short
    --strict-markers

markers =
    unit: Unit tests
    integration: Integration tests
    api: API endpoint tests
    database: Database tests
    auth: Authentication tests
    slow: Slow running tests
