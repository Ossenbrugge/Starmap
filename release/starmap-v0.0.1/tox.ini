[tox]
envlist = py{38,39,310,311,312}, flake8, mypy, coverage
isolated_build = True
skip_missing_interpreters = True

[testenv]
deps = 
    -r{toxinidir}/requirements.txt
    -r{toxinidir}/tests/requirements.txt
setenv = 
    STARMAP_SECRET_KEY = test-secret-key-tox
    FLASK_ENV = testing
    PYTHONPATH = {toxinidir}
commands = 
    python -m pytest tests/ -v --tb=short

[testenv:flake8]
deps = flake8
commands = 
    flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
    flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

[testenv:mypy]
deps = 
    mypy
    {[testenv]deps}
commands = 
    mypy app.py auth.py --ignore-missing-imports --no-strict-optional

[testenv:coverage]
deps = 
    {[testenv]deps}
    coverage[toml]
commands = 
    coverage run -m pytest tests/
    coverage report -m
    coverage html
    coverage xml

[testenv:security]
deps = 
    {[testenv]deps}
    bandit
    safety
commands = 
    bandit -r . -f json -o bandit-report.json
    safety check --json --output safety-report.json

[testenv:integration]
deps = {[testenv]deps}
setenv = 
    {[testenv:setenv]
    INTEGRATION_TEST = 1
commands_pre = 
    python app.py &
    sleep 5
commands = 
    python tests/test_api_auth.py
commands_post = 
    pkill -f "python app.py" || true

[testenv:performance]
deps = 
    {[testenv]deps}
    pytest-benchmark
commands = 
    python tests/test_performance.py

[flake8]
max-line-length = 127
max-complexity = 10
exclude = 
    .git,
    __pycache__,
    .venv,
    .tox,
    *.egg,
    build,
    dist,
    venv,
    env

[coverage:run]
source = .
omit = 
    */tests/*
    */venv/*
    */.venv/*
    */tox/*
    setup.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if __name__ == .__main__.:
    if TYPE_CHECKING: