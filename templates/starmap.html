<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starmap - Felgenland Saga</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- A-Frame for VR/3D starfield -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
    
    <!-- A-Frame Loading Screen Component -->
    <script>
        // A-Frame Loading Screen Component for main app
        if (typeof AFRAME !== 'undefined') {
            AFRAME.registerComponent('loading-screen', {
                init: function() {
                    console.log('🔄 A-Frame loading screen component initialized');
                    this.showLoadingScreen();
                    
                    // Listen for scene loaded event
                    this.el.addEventListener('loaded', () => {
                        console.log('✅ A-Frame scene loaded');
                        setTimeout(() => {
                            this.hideLoadingScreen();
                        }, 1000);
                    });
                    
                    // Also hide on renderstart
                    this.el.addEventListener('renderstart', () => {
                        console.log('🎬 A-Frame render started');
                        setTimeout(() => {
                            this.hideLoadingScreen();
                        }, 2000);
                    });
                },
                
                showLoadingScreen: function() {
                    // Only show if A-Frame view is active
                    const aframeContainer = document.getElementById('aframe-container');
                    if (!aframeContainer || aframeContainer.style.display === 'none') return;
                    
                    const loadingDiv = document.createElement('div');
                    loadingDiv.id = 'aframe-loading-screen';
                    loadingDiv.innerHTML = `
                        <div style="
                            position: fixed;
                            top: 0;
                            left: 0;
                            width: 100%;
                            height: 100%;
                            background: linear-gradient(135deg, #000011 0%, #1a1a2e 50%, #16213e 100%);
                            display: flex;
                            flex-direction: column;
                            justify-content: center;
                            align-items: center;
                            z-index: 9999;
                            color: #00ff88;
                            font-family: 'Courier New', monospace;
                        ">
                            <div style="text-align: center;">
                                <h2 style="font-size: 2em; margin-bottom: 20px; text-shadow: 0 0 20px #00ff88;">🥽 Loading VR Starfield</h2>
                                <div style="
                                    width: 40px;
                                    height: 40px;
                                    border: 3px solid rgba(0, 255, 136, 0.3);
                                    border-top: 3px solid #00ff88;
                                    border-radius: 50%;
                                    animation: spin 1s linear infinite;
                                    margin: 20px auto;
                                "></div>
                                <p style="font-size: 1em; margin: 10px 0;">Initializing A-Frame VR...</p>
                                <p style="font-size: 0.8em; opacity: 0.7;" id="aframe-loading-status">Loading assets...</p>
                            </div>
                        </div>
                    `;
                    
                    document.body.appendChild(loadingDiv);
                    console.log('📺 A-Frame loading screen displayed');
                },
                
                hideLoadingScreen: function() {
                    const loadingScreen = document.getElementById('aframe-loading-screen');
                    if (loadingScreen) {
                        loadingScreen.style.opacity = '0';
                        loadingScreen.style.transition = 'opacity 0.5s ease-out';
                        setTimeout(() => {
                            loadingScreen.remove();
                            console.log('✨ A-Frame loading screen hidden');
                        }, 500);
                    }
                }
            });
        }
    </script>
    
    <!-- Three.js for cinematic 3D (ES6 modules) -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/examples/jsm/controls/OrbitControls": "https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js"
            }
        }
    </script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/starmap.css') }}">
</head>
<body>
    <div class="container-fluid h-100">
        <div class="row h-100">
            <!-- Control Panel -->
            <div class="col-md-3 col-lg-2 control-panel p-0 d-flex flex-column" id="sidebarCol">
                <!-- Header + collapse toggle -->
                <div class="d-flex align-items-center px-2 py-2" style="border-bottom:1px solid #333; flex-shrink:0;">
                    <span class="text-primary fw-bold flex-grow-1 small">🌌 Starmap</span>
                    <button id="sidebarToggle" class="btn btn-sm btn-outline-secondary py-0 px-1"
                            onclick="toggleSidebar()" title="Toggle sidebar">◀</button>
                </div>

                <div id="sidebarContent" class="flex-grow-1 d-flex flex-column overflow-hidden">
                    <!-- Auth status -->
                    {% if user %}
                    <div class="alert alert-success small mx-2 mt-2 mb-0 py-1">
                        🛡️ <strong>{{ user.username }}</strong>
                        <div class="mt-1">
                            <a href="{{ url_for('logout') }}" class="btn btn-outline-light btn-sm py-0">Logout</a>
                            <button onclick="generateApiToken()" class="btn btn-outline-info btn-sm py-0">Token</button>
                        </div>
                    </div>
                    {% endif %}

                    <!-- Status bar -->
                    <div id="status" class="alert alert-info small mx-2 mt-2 mb-0 py-1">
                        Initializing...
                    </div>

                    <!-- Tab navigation -->
                    <ul class="nav nav-tabs nav-fill px-2 pt-2 flex-shrink-0" id="controlTabs" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active px-1 py-1" data-bs-toggle="tab"
                                    data-bs-target="#tabFilters" title="Filters">🔭</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link px-1 py-1" data-bs-toggle="tab"
                                    data-bs-target="#tabLore" title="Lore">📖</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link px-1 py-1" data-bs-toggle="tab"
                                    data-bs-target="#tabLayers" title="Layers">🗺️</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link px-1 py-1" data-bs-toggle="tab"
                                    data-bs-target="#tabTools" title="Tools">🔧</button>
                        </li>
                    </ul>

                    <div class="tab-content px-2 pt-2 overflow-auto flex-grow-1" style="min-height:0;">

                        <!-- ── FILTERS TAB ── -->
                        <div class="tab-pane fade show active" id="tabFilters" role="tabpanel">
                            <div class="mb-3">
                                <label class="form-label small fw-bold">Search Stars</label>
                                <div class="input-group input-group-sm">
                                    <input type="text" id="searchInput" class="form-control" placeholder="Star name...">
                                    <button class="btn btn-outline-primary" onclick="searchStars()">🔍</button>
                                </div>
                                <div id="searchResults" class="mt-2"></div>
                            </div>

                            <div class="mb-2">
                                <label class="form-label small fw-bold">Magnitude Limit</label>
                                <input type="range" id="magLimit" class="form-range" min="1" max="12" value="8" step="0.5">
                                <small class="text-muted">Max: <span id="magValue">8.0</span></small>
                            </div>

                            <div class="mb-2">
                                <label class="form-label small">Star Limit</label>
                                <select id="starLimit" class="form-select form-select-sm">
                                    <option value="500">500 stars</option>
                                    <option value="1000" selected>1000 stars</option>
                                    <option value="2000">2000 stars</option>
                                    <option value="5000">5000 stars</option>
                                </select>
                            </div>

                            <div class="mb-2">
                                <label class="form-label small">Spectral Type</label>
                                <select id="spectralType" class="form-select form-select-sm">
                                    <option value="">All Types</option>
                                    <option value="O">O - Blue Giants</option>
                                    <option value="B">B - Blue</option>
                                    <option value="A">A - White</option>
                                    <option value="F">F - Yellow-White</option>
                                    <option value="G">G - Yellow (Sun-like)</option>
                                    <option value="K">K - Orange</option>
                                    <option value="M">M - Red Dwarfs</option>
                                </select>
                            </div>

                            <button class="btn btn-primary btn-sm w-100 mb-3" onclick="applyFilters()">Apply Filters</button>

                            <div>
                                <label class="form-label small fw-bold">Statistics</label>
                                <div id="stats" class="small text-muted">Loading...</div>
                            </div>
                        </div>

                        <!-- ── LORE TAB ── -->
                        <div class="tab-pane fade" id="tabLore" role="tabpanel">
                            <!-- Quick Views -->
                            <div class="mb-3">
                                <h6 class="text-muted small mb-2">⚡ Quick Views</h6>
                                <div class="d-grid gap-1">
                                    <button class="btn btn-outline-danger btn-sm"
                                            onclick="applyQuickView('felgenland_union')">🔴 Felgenland Union</button>
                                    <button class="btn btn-outline-primary btn-sm"
                                            onclick="applyQuickView('terran_core')">🔵 Terran Core</button>
                                    <button class="btn btn-outline-warning btn-sm"
                                            onclick="applyQuickView('frontier_tors')">⚡ Frontier Tors</button>
                                    <button class="btn btn-outline-success btn-sm"
                                            onclick="applyQuickView('all_trade')">🛤 All Trade Networks</button>
                                </div>
                            </div>

                            <!-- Nation selector -->
                            <div class="mb-2">
                                <h6 class="text-muted small mb-1">🌍 Nation / Faction</h6>
                                <select id="nationSelector" class="form-select form-select-sm mb-2"
                                        onchange="onNationSelect(this.value)">
                                    <option value="">— Show All Nations —</option>
                                </select>
                                <div class="form-check form-switch mb-1">
                                    <input class="form-check-input" type="checkbox" id="showOnlyNation"
                                           onchange="toggleShowOnlyNation(this.checked)">
                                    <label class="form-check-label small" for="showOnlyNation">Show only this nation</label>
                                </div>
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" id="politicalViewToggle"
                                           onchange="togglePoliticalView(this.checked)">
                                    <label class="form-check-label small" for="politicalViewToggle">🎨 Political colours</label>
                                </div>
                            </div>

                            <!-- Lore panel (dynamic) -->
                            <div id="lorePanel" class="d-none mt-2">
                                <div id="lorePanelContent"></div>
                            </div>
                        </div>

                        <!-- ── LAYERS TAB ── -->
                        <div class="tab-pane fade" id="tabLayers" role="tabpanel">
                            <label class="form-label small fw-bold">Overlays</label>
                            <div class="row g-1 mb-2">
                                <div class="col-6">
                                    <div class="form-check form-switch">
                                        <input class="form-check-input" type="checkbox" id="nationsOverlay">
                                        <label class="form-check-label small" for="nationsOverlay">Nations</label>
                                    </div>
                                </div>
                                <div class="col-6">
                                    <div class="form-check form-switch">
                                        <input class="form-check-input" type="checkbox" id="tradeRoutesOverlay" checked>
                                        <label class="form-check-label small" for="tradeRoutesOverlay">Trade</label>
                                    </div>
                                </div>
                                <div class="col-6">
                                    <div class="form-check form-switch">
                                        <input class="form-check-input" type="checkbox" id="stellarRegionsOverlay">
                                        <label class="form-check-label small" for="stellarRegionsOverlay">Regions</label>
                                    </div>
                                </div>
                                <div class="col-6">
                                    <div class="form-check form-switch">
                                        <input class="form-check-input" type="checkbox" id="galacticDirectionsOverlay">
                                        <label class="form-check-label small" for="galacticDirectionsOverlay">Axes</label>
                                    </div>
                                </div>
                                <div class="col-6">
                                    <div class="form-check form-switch">
                                        <input class="form-check-input" type="checkbox" id="exoplanetsOverlay" checked>
                                        <label class="form-check-label small" for="exoplanetsOverlay">Planets</label>
                                    </div>
                                </div>
                            </div>
                            <button class="btn btn-outline-success btn-sm w-100" onclick="showNationsLegend()">
                                🏛️ Nations Legend
                            </button>
                        </div>

                        <!-- ── TOOLS TAB ── -->
                        <div class="tab-pane fade" id="tabTools" role="tabpanel">
                            <div class="mb-3">
                                <label class="form-label small fw-bold">Starfield View</label>
                                <div class="btn-group w-100" role="group">
                                    <input type="radio" class="btn-check" name="viewToggle" id="threejsView" checked onchange="switchView('threejs')">
                                    <label class="btn btn-outline-warning btn-sm" for="threejsView">🌟 Three.js</label>
                                    <input type="radio" class="btn-check" name="viewToggle" id="aframeView" onchange="switchView('aframe')">
                                    <label class="btn btn-outline-success btn-sm" for="aframeView">🥽 VR</label>
                                </div>
                            </div>
                            <div class="d-grid gap-2">
                                <button class="btn btn-outline-info btn-sm" onclick="resetView()">🎯 Reset View</button>
                                <button class="btn btn-outline-secondary btn-sm" onclick="takeStarmapScreenshot()" title="Save PNG">📷 Screenshot</button>
                                <button class="btn btn-outline-warning btn-sm" onclick="exportData()">💾 Export CSV</button>
                            </div>
                        </div>

                    </div><!-- /tab-content -->
                </div><!-- /sidebarContent -->
            </div>
            
            <!-- Main Starmap -->
            <div class="col-md-9 col-lg-10 p-0">
                <!-- Three.js View -->
                <div id="threejs-error-banner" class="alert alert-danger m-3" style="display:none;"></div>
                <div id="threejs-container" class="starmap-container"></div>
                
                <!-- A-Frame VR View -->
                <div id="aframe-container" class="starmap-container" style="display: none;">
                    <a-scene 
                        id="starfield-scene"
                        background="color: #000011"
                        vr-mode-ui="enabled: true"
                        embedded
                        style="height: 100vh; width: 100%;"
                        fog="type: linear; color: #0B1426; near: 50; far: 300"
                        loading-screen
                        a-assets-timeout="30000">
                        
                        <!-- Assets with increased timeout -->
                        <a-assets timeout="30000">
                            <!-- Star materials -->
                            <a-mixin id="star-base" 
                                     geometry="primitive: sphere; radius: 0.1"
                                     material="shader: standard; metalness: 0; roughness: 0; emissive: #ffffff; emissiveIntensity: 0.8"></a-mixin>
                            
                            <!-- Nation colors -->
                            <a-mixin id="terran-star" 
                                     mixin="star-base"
                                     material="emissive: #1565C0; emissiveIntensity: 1.2"></a-mixin>
                            <a-mixin id="felgenland-star" 
                                     mixin="star-base"
                                     material="emissive: #4CAF50; emissiveIntensity: 1.2"></a-mixin>
                            <a-mixin id="neutral-star" 
                                     mixin="star-base"
                                     material="emissive: #ffffff; emissiveIntensity: 0.8"></a-mixin>
                            <a-mixin id="fictional-star" 
                                     mixin="star-base"
                                     material="emissive: #00ff88; emissiveIntensity: 1.5"></a-mixin>
                        </a-assets>
                        
                        <!-- Camera with orbit controls -->
                        <a-camera 
                            id="camera"
                            position="0 0 30"
                            look-controls="enabled: true"
                            wasd-controls="enabled: true"
                            orbit-controls="
                                target: 0 0 0;
                                enableDamping: true;
                                dampingFactor: 0.1;
                                rotateSpeed: 0.05;
                                enableZoom: true;
                                minDistance: 5;
                                maxDistance: 200;
                                enablePan: true;">
                            
                            <!-- VR controllers -->
                            <a-entity 
                                id="left-hand" 
                                hand-controls="hand: left"
                                laser-controls
                                raycaster="objects: .star"></a-entity>
                            <a-entity 
                                id="right-hand" 
                                hand-controls="hand: right"
                                laser-controls
                                raycaster="objects: .star"></a-entity>
                        </a-camera>
                        
                        <!-- Ambient lighting -->
                        <a-light type="ambient" color="#404040" intensity="0.4"></a-light>
                        
                        <!-- Directional light (represents galactic core) -->
                        <a-light 
                            type="directional" 
                            position="0 10 0" 
                            color="#ffffff" 
                            intensity="0.2"
                            light="castShadow: false"></a-light>
                        
                        <!-- Stars container -->
                        <a-entity id="star-field"></a-entity>
                        
                        <!-- Galactic grid (optional) -->
                        <a-entity 
                            id="galactic-grid"
                            visible="false">
                            <!-- Grid lines will be added via JavaScript -->
                        </a-entity>
                        
                        <!-- Navigation info -->
                        <a-text 
                            id="nav-info"
                            position="0 25 -30"
                            value="🌌 Felgenland Starfield - Use mouse/WASD to navigate - Click stars for details"
                            color="#00ff88"
                            align="center"
                            scale="2 2 2"></a-text>
                    </a-scene>
                </div>
                
                <!-- Star Details Panel -->
                <div id="starDetails" class="star-details-panel">
                    <div class="card">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <h6 class="mb-0">Star Details</h6>
                            <button class="btn-close btn-close-white" onclick="hideStarDetails()"></button>
                        </div>
                        <div class="card-body" id="starDetailsContent">
                            <p class="text-muted">Click on a star to see details</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Nations Legend Modal -->
    <div class="modal fade" id="nationsModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">🏛️ Nations of the Felgenland Saga</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="nationsContent">
                    Loading nations...
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom JavaScript -->
    <script type="module" src="{{ url_for('static', filename='js/starmap-threejs-simple.js') }}"></script>
    
    <script>
        // Authentication functions
        async function generateApiToken() {
            try {
                const response = await fetch('/api/v1/auth/token', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        expires_hours: 24
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // Show token in a modal-like alert
                    const tokenInfo = `🎫 API Token Generated Successfully!
                        
Token: ${data.token}

Expires: ${data.expires_in_hours} hours
User: ${data.user}

Use in API requests:
Authorization: Bearer ${data.token}`;
                    
                    try {
                        await navigator.clipboard.writeText(data.token);
                        alert(tokenInfo + '\n\n✅ Token copied to clipboard!');
                    } catch {
                        alert(tokenInfo + '\n\n(Copy the token manually from above)');
                    }
                } else {
                    alert('❌ Failed to generate API token');
                }
            } catch (error) {
                console.error('Error generating token:', error);
                alert('❌ Error generating API token');
            }
        }
        
        // HTML escape helper to prevent XSS when inserting server data into innerHTML
        function esc(str) {
            const div = document.createElement('div');
            div.appendChild(document.createTextNode(String(str ?? '')));
            return div.innerHTML;
        }

        // View switching functionality
        let currentView = 'threejs';
        let aframeInitialized = false;
        let threejsInitialized = false;
        let threejsStarmap = null;
        
        function switchView(view) {
            currentView = view;

            const threejsContainer = document.getElementById('threejs-container');
            const aframeContainer = document.getElementById('aframe-container');

            // Hide all containers
            threejsContainer.style.display = 'none';
            aframeContainer.style.display = 'none';

            if (view === 'threejs') {
                threejsContainer.style.display = 'block';
                
                // Initialize Three.js if not already done
                if (!threejsInitialized) {
                    initializeThreeJSStarfield();
                } else if (threejsStarmap) {
                    threejsStarmap.setVisible(true);
                    threejsStarmap.resize();
                }
            } else if (view === 'aframe') {
                aframeContainer.style.display = 'block';
                
                // Initialize A-Frame starfield if not already done
                if (!aframeInitialized) {
                    initializeAFrameStarfield();
                    aframeInitialized = true;
                } else {
                    // Refresh A-Frame scene
                    refreshAFrameStarfield();
                }
            }
        }
        
        // Three.js starfield functions
        async function initializeThreeJSStarfield() {
            console.log('🌟 Initializing Three.js starfield...');

            try {
                // ThreeJSStarmap.init() calls loadStars() internally — don't duplicate it.
                threejsStarmap = new window.ThreeJSStarmap();

                // Wait for the internal loadStars() to finish before loading overlays.
                // Poll every 200 ms; give up after 30 s (150 attempts) so the page never hangs.
                await new Promise((resolve, reject) => {
                    let attempts = 0;
                    const MAX_ATTEMPTS = 150;
                    const check = () => {
                        if (threejsStarmap.currentStars && threejsStarmap.currentStars.length > 0) {
                            resolve();
                        } else if (++attempts >= MAX_ATTEMPTS) {
                            reject(new Error('Star loading timed out after 30 s — check server logs and browser console.'));
                        } else {
                            setTimeout(check, 200);
                        }
                    };
                    setTimeout(check, 300);
                });

                // Share the already-loaded stars with search so we don't fetch twice
                allStars = threejsStarmap.currentStars.filter(s =>
                    s.x != null && !isNaN(s.x) &&
                    s.y != null && !isNaN(s.y) &&
                    s.z != null && !isNaN(s.z)
                );
                console.log(`✅ Shared ${allStars.length} stars with search cache`);

                await loadAllThreeJSOverlays();
                populateNationDropdown();

                threejsInitialized = true;
                console.log('✅ Three.js starfield initialized');
            } catch (error) {
                console.error('❌ Error initializing Three.js starfield:', error);
                const banner = document.getElementById('threejs-error-banner');
                if (banner) {
                    banner.textContent = `Failed to load starmap: ${error.message}`;
                    banner.style.display = 'block';
                }
            }
        }
        
        // Load all Three.js overlays
        async function loadAllThreeJSOverlays() {
            if (!threejsStarmap) return;
            
            try {
                await threejsStarmap.loadStellarRegions();
                await threejsStarmap.loadNations();
                await threejsStarmap.loadTradeRoutes();
                await threejsStarmap.loadExoplanets();
                console.log('✅ All Three.js overlays loaded');
            } catch (error) {
                console.error('❌ Error loading Three.js overlays:', error);
            }
        }
        
        let searchResults = [];
        let allStars = []; // Cache for all stars

        // Load all stars for search functionality
        async function loadAllStarsForSearch() {
            // Reuse data already loaded by Three.js init if available
            if (allStars.length > 0) return;

            try {
                const response = await fetch('/api/v1/stars?limit=50000&mag_limit=15');
                const data = await response.json();
                if (data.success && data.data) {
                    allStars = data.data.filter(star =>
                        star.x != null && !isNaN(star.x) &&
                        star.y != null && !isNaN(star.y) &&
                        star.z != null && !isNaN(star.z)
                    );
                    addMissingFictionalStars();
                }
            } catch (error) {
                console.error('Error loading stars for search:', error);
                allStars = [];
            }
        }

        function addMissingFictionalStars() {
            // Add Tiefe-Grenze Tor if missing
            const tiefeGrenzeExists = allStars.some(star => star.fictional_name === 'Tiefe-Grenze Tor' || star.name === 'Tiefe-Grenze Tor');

            if (!tiefeGrenzeExists) {
                // Estimated coordinates for Tiefe-Grenze Tor (edge of explored space)
                const tiefeGrenze = {
                    id: 999999,

        // Connect search functionality to Three.js starmap
        function searchStars() {
            const searchInput = document.getElementById('searchInput');
            const searchTerm = searchInput.value.trim();

            if (!searchTerm) {
                document.getElementById('searchResults').innerHTML = '';
                return;
            }

            // First load all stars if not already loaded
            if (allStars.length === 0) {
                loadAllStarsForSearch().then(() => performSearch(searchTerm));
            } else {
                performSearch(searchTerm);
            }
        }

        function performSearch(searchTerm) {
            console.log('🔍 Performing search for:', searchTerm);

            if (allStars.length === 0) {
                document.getElementById('searchResults').innerHTML = '<small class="text-muted">Loading star database...</small>';
                return;
            }

            const search = searchTerm.toLowerCase().trim();
            searchResults = [];

            // Search by various criteria
            allStars.forEach(star => {
                let matchScore = 0;
                const starName = star.fictional_name || star.name || '';

                // Exact matches get highest priority
                if (star.id && star.id.toString() === search) matchScore = 100;
                else if (starName.toLowerCase() === search) matchScore = 90;
                else if (starName.toLowerCase().startsWith(search)) matchScore = 80;
                else if (starName.toLowerCase().includes(search)) matchScore = 70;

                // Check catalog IDs
                if (star.catalog_ids && Array.isArray(star.catalog_ids)) {
                    star.catalog_ids.forEach(catalogId => {
                        if (catalogId && catalogId.toString().toLowerCase() === search) matchScore = 95;
                        else if (catalogId && catalogId.toString().toLowerCase().includes(search)) matchScore = 75;
                    });
                }

                // Search individual catalog fields for direct catalog number searches
                if (search.startsWith('hd ') && star.id_hd && star.id_hd.toString() === search.substring(3)) matchScore = 95;
                if (search.startsWith('hip ') && star.id_hip && star.id_hip.toString() === search.substring(4)) matchScore = 95;
                if (search.startsWith('hr ') && star.id_hr && star.id_hr.toString() === search.substring(3)) matchScore = 95;
                if (search.startsWith('gliese ') && star.id_gliese && star.id_gliese.toString() === search.substring(7)) matchScore = 95;
                if (search.startsWith('gaia ') && star.id_catalog_gaia && star.id_catalog_gaia.toString().includes(search.substring(5))) matchScore = 85;

                // Search by proper names
                if (search.startsWith('gacrux') && star.name && star.name.includes('Gacrux')) matchScore = 85;
                if (search.startsWith('betelgeuse') && star.name && star.name.includes('Betelgeuse')) matchScore = 85;
                if (search.startsWith('rigel') && star.name && star.name.includes('Rigel')) matchScore = 85;
                if (search.startsWith('deneb') && star.name && star.name.includes('Deneb')) matchScore = 85;

                // Special cases
                if (search.includes('sol') && starName.toLowerCase().includes('sol')) matchScore = 85;
                if (search.includes('20 lmi') && starName.includes('20 LMi')) matchScore = 85;
                if (search === 'tiefe' && starName.includes('Tiefe-Grenze')) matchScore = 85;

                // Search by constellation
                if (star.constellation && star.constellation.toLowerCase().includes(search)) matchScore = 60;

                if (matchScore > 0) {
                    searchResults.push({ star, matchScore, searchReason: getSearchReason(matchScore, star, search) });
                }
            });

            // Sort by match score (highest first)
            searchResults.sort((a, b) => b.matchScore - a.matchScore);

            // Take top 5 results
            searchResults = searchResults.slice(0, 5);

            displaySearchResults(searchResults, searchTerm);
        }

        function getSearchReason(matchScore, star, searchTerm) {
            if (matchScore >= 100) return `ID match: ${star.id}`;
            if (matchScore >= 95) return 'Exact catalog ID match';
            if (matchScore >= 90) return 'Exact name match';
            if (matchScore >= 85) return 'Special name match';
            if (matchScore >= 80) return 'Name prefix match';
            if (matchScore >= 75) return 'Catalog ID partial match';
            if (matchScore >= 70) return 'Name contains search term';
            return 'Related match';
        }

        function displaySearchResults(results, searchTerm) {
            const searchResultsDiv = document.getElementById('searchResults');

            if (results.length === 0) {
                searchResultsDiv.innerHTML = `<small class="text-warning">❌ No stars found matching "${esc(searchTerm)}"</small>`;
                return;
            }

            let html = '<div class="search-results-list">';
            html += `<small class="text-muted mb-2 d-block">${results.length} result(s) for "${esc(searchTerm)}":</small>`;

            results.forEach((result, index) => {
                const star = result.star;
                const starName = esc(star.fictional_name || star.name || 'Unknown Star');
                const coords = `(${parseFloat(star.x || 0).toFixed(2)}, ${parseFloat(star.y || 0).toFixed(2)}, ${parseFloat(star.z || 0).toFixed(2)}) pc`;
                const magnitude = star.magnitude ? `Mag: ${parseFloat(star.magnitude).toFixed(2)}` : 'Unknown mag';
                const spectral = esc(star.spectral_class || 'Unknown type');

                html += `
                    <div class="search-result-item d-flex justify-content-between align-items-center py-1 px-2 mb-1 rounded bg-dark" onclick="selectSearchResult(${index})" style="cursor: pointer;">
                        <div class="flex-grow-1">

        function getContrastColor(hexColor) {
            // Simple function to determine if text should be black or white based on background color
            if (!hexColor) return 'white';

            // Remove # if present
            const color = hexColor.replace('#', '');

            // Convert to RGB
            const r = parseInt(color.substr(0, 2), 16);
            const g = parseInt(color.substr(2, 2), 16);
            const b = parseInt(color.substr(4, 2), 16);

            // Calculate brightness
            const brightness = (r * 299 + g * 587 + b * 114) / 1000;

            return brightness > 128 ? 'black' : 'white';
        }

        function createAFrameStars(stars) {
            const starField = document.getElementById('star-field');
            if (!starField) return;
            
            stars.forEach((star, index) => {
                // Create star entity
                const starEntity = document.createElement('a-sphere');
                
                // Position (scale coordinates for better visibility)
                starEntity.setAttribute('position', `${star.x} ${star.z} ${-star.y}`);
                
                // Size based on magnitude (brighter = bigger)
                const size = Math.max(0.05, (8 - star.magnitude) * 0.03);
                starEntity.setAttribute('radius', size);
                
                // Color and material based on star properties
                let color = '#ffffff';

                if (star.fictional_name) {
                    color = '#00ff88';
                } else if (star.nation) {
                    if (star.nation.id === 'terran_directorate') {
                        color = '#1565C0';
                    } else if (star.nation.id === 'felgenland_union') {
                        color = '#4CAF50';
                    }
                } else {
                    // Color by spectral class
                    const spectral = star.spectral_class?.charAt(0) || 'G';
                    const spectralColors = {
                        'O': '#9bb0ff', 'B': '#aabfff', 'A': '#cad7ff',
                        'F': '#f8f7ff', 'G': '#fff4ea', 'K': '#ffd2a1',
                        'M': '#ffad51'
                    };
                    color = spectralColors[spectral] || '#ffffff';
                }
                
                starEntity.setAttribute('material', `
                    shader: standard;
                    metalness: 0;
                    roughness: 0;
                    emissive: ${color};
                    emissiveIntensity: ${star.fictional_name ? 1.5 : 0.8};
                `);
                
                // Add interaction
                starEntity.setAttribute('class', 'star');
                starEntity.setAttribute('data-star-id', star.id);
                starEntity.setAttribute('data-star-name', star.fictional_name || star.name);
                
                // Click event for star details
                starEntity.addEventListener('click', function() {
                    showAFrameStarDetails(star);
                });
                
                // Hover effect
                starEntity.addEventListener('mouseenter', function() {
                    this.setAttribute('scale', '2 2 2');
                });
                
                starEntity.addEventListener('mouseleave', function() {
                    this.setAttribute('scale', '1 1 1');
                });
                
                starField.appendChild(starEntity);
            });
            
            console.log(`🌟 Created ${stars.length} A-Frame star entities`);
        }
        
        function showAFrameStarDetails(star) {

        function updateLorePanel(nationId) {
            const panel   = document.getElementById('lorePanel');
            const content = document.getElementById('lorePanelContent');
            if (!panel || !content) return;
            if (!nationId || !threejsStarmap) { panel.classList.add('d-none'); return; }

            const nation = threejsStarmap.nations.find(
                n => (n._id || n.id) === nationId
            );
            if (!nation) { panel.classList.add('d-none'); return; }

            const color = (nation.appearance && nation.appearance.color) || nation.color || '#888888';
            const safeColor = /^#[0-9A-Fa-f]{6}$/.test(color) ? color : '#888888';

            // Resolve territory star names
            const territories = (nation.territories || []).map(t => {
                const id   = (typeof t === 'object') ? t.star_id : t;
                const star = threejsStarmap.currentStars.find(s => s.id === id);
                return { id, name: star?.fictional_name || star?.name || `Star #${id}`, star };
            });

            const colorDot = `<span style="display:inline-block;width:10px;height:10px;
                border-radius:50%;background:${safeColor};margin-right:5px;flex-shrink:0;"></span>`;

            content.innerHTML = `
                <div class="border rounded p-2" style="border-color:${safeColor}55 !important">
                    <div class="d-flex align-items-center mb-1">
                        ${colorDot}<strong class="small">${esc(nation.name)}</strong>
                    </div>
                    <small class="text-muted d-block mb-1">${esc(nation.government?.type || nation.government_type || '')}</small>
                    <p class="small mb-2" style="font-size:0.75rem">${esc(nation.description || '')}</p>
                    ${territories.length ? `<div class="mb-1"><strong class="small">Key Systems (${territories.length})</strong></div>` : ''}
                    ${territories.map(t => `
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <small class="text-truncate me-1">${esc(t.name)}</small>
                            ${t.star ? `<button class="btn btn-outline-light btn-sm py-0 px-1 flex-shrink-0"
                                style="font-size:0.6rem"
                                onclick='flyToNamedStar(${JSON.stringify({id:t.star.id,x:t.star.x,y:t.star.y,z:t.star.z,name:t.name})})'>→</button>` : ''}
                        </div>`).join('')}
                </div>`;
            panel.classList.remove('d-none');
        }

        function flyToNamedStar(star) {
            if (!threejsStarmap || !star) return;
            threejsStarmap.flyToStar(star, 100);
            threejsStarmap.highlightStar(star);
            threejsStarmap.displayStarDetails(star);
        }

        // Initialize Three.js view on page load
        document.addEventListener('DOMContentLoaded', () => {
            console.log('DOM loaded, current view:', currentView);

            // Set up overlay toggle event listeners
            ['nationsOverlay', 'tradeRoutesOverlay', 'stellarRegionsOverlay', 'galacticDirectionsOverlay', 'exoplanetsOverlay'].forEach(id => {
                const element = document.getElementById(id);
                if (element) {
                    element.addEventListener('change', updateOverlays);
                }
            });

            // Give scripts time to finish loading before initialising Three.js
            setTimeout(() => {
                if (currentView === 'threejs') {
                    initializeThreeJSStarfield();
                }
            }, 500);
        });
        
    </script>
</body>
</html>
