<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Test</title>
    <style>
        body { margin: 0; padding: 20px; background: #000; color: #fff; font-family: Arial, sans-serif; }
        #threejs-container { width: 800px; height: 600px; border: 1px solid #333; margin: 20px 0; }
        .controls { margin: 10px 0; }
        button { margin: 5px; padding: 10px; background: #333; color: #fff; border: 1px solid #555; cursor: pointer; }
        button:hover { background: #555; }
        #console { background: #111; padding: 10px; height: 200px; overflow-y: auto; font-family: monospace; font-size: 12px; }
    </style>
</head>
<body>
    <h1>Three.js Starmap Test</h1>
    
    <div class="controls">
        <button onclick="runBasicTest()">Basic Three.js Test</button>
        <button onclick="runStarmapTest()">Starmap Test</button>
        <button onclick="clearConsole()">Clear Console</button>
    </div>
    
    <div id="threejs-container"></div>
    
    <div id="console"></div>
    
    <!-- Three.js for cinematic 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r160/three.min.js"></script>
    
    <!-- Three.js OrbitControls from reliable CDN -->
    <script>
        // Load OrbitControls after Three.js
        if (typeof THREE !== 'undefined') {
            const script = document.createElement('script');
            script.src = 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js';
            script.onload = function() {
                logToConsole('✅ OrbitControls loaded successfully');
            };
            script.onerror = function() {
                logToConsole('⚠️ OrbitControls failed to load - implementing fallback');
                // Simple fallback controls
                THREE.OrbitControls = function(camera, domElement) {
                    this.camera = camera;
                    this.domElement = domElement;
                    this.enabled = true;
                    this.enableDamping = true;
                    this.dampingFactor = 0.1;
                    this.minDistance = 10;
                    this.maxDistance = 1000;
                    this.enablePan = true;
                    this.target = new THREE.Vector3(0, 0, 0);
                    
                    this.update = function() {
                        // Basic update function
                    };
                    
                    this.dispose = function() {
                        // Basic dispose function
                    };
                    
                    logToConsole('✅ OrbitControls fallback initialized');
                };
            };
            document.head.appendChild(script);
        } else {
            logToConsole('❌ THREE.js not loaded');
        }
    </script>
    
    <!-- Include the refactored starmap code -->
    <script src="static/js/starmap-threejs-simple.js"></script>
    
    <script>
        let consoleDiv = document.getElementById('console');
        let threejsStarmap = null;
        
        function logToConsole(message) {
            const timestamp = new Date().toLocaleTimeString();
            consoleDiv.innerHTML += `[${timestamp}] ${message}\n`;
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
            console.log(message);
        }
        
        function clearConsole() {
            consoleDiv.innerHTML = '';
        }
        
        function runBasicTest() {
            logToConsole('🧪 Running basic Three.js test...');
            
            const container = document.getElementById('threejs-container');
            container.innerHTML = '';
            
            if (typeof THREE === 'undefined') {
                logToConsole('❌ THREE is not defined!');
                return;
            }
            
            logToConsole('✅ THREE version: ' + THREE.REVISION);
            
            try {
                // Create scene
                const scene = new THREE.Scene();
                scene.background = new THREE.Color(0x000011);
                
                // Create camera
                const camera = new THREE.PerspectiveCamera(75, 800 / 600, 0.1, 1000);
                camera.position.z = 5;
                
                // Create renderer
                const renderer = new THREE.WebGLRenderer();
                renderer.setSize(800, 600);
                container.appendChild(renderer.domElement);
                
                // Create a small, colored cube as specified
                const geometry = new THREE.BoxGeometry(0.5, 0.5, 0.5); // Small cube
                const material = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: false }); // Your exact specification
                const cube = new THREE.Mesh(geometry, material);
                scene.add(cube);
                
                logToConsole('✅ Basic Three.js scene created with rotating cube');
                
                // Animation loop
                let frameCount = 0;
                function animate() {
                    requestAnimationFrame(animate);
                    
                    cube.rotation.x += 0.01;
                    cube.rotation.y += 0.01;
                    
                    renderer.render(scene, camera);
                    
                    frameCount++;
                    if (frameCount % 60 === 0) {
                        logToConsole(`🎬 Frame ${frameCount}: Animation running`);
                    }
                }
                
                animate();
                
            } catch (error) {
                logToConsole('❌ Error in basic test: ' + error.message);
            }
        }
        
        function runStarmapTest() {
            logToConsole('🌟 Running starmap test...');
            
            const container = document.getElementById('threejs-container');
            container.innerHTML = '';
            
            try {
                // Create ThreeJS starmap instance
                threejsStarmap = new window.ThreeJSStarmap();
                
                // Wait for initialization
                setTimeout(() => {
                    // Create some test star data
                    const testStars = [];
                    for (let i = 0; i < 100; i++) {
                        testStars.push({
                            id: i,
                            name: `Test Star ${i}`,
                            x: (Math.random() - 0.5) * 200,
                            y: (Math.random() - 0.5) * 200,
                            z: (Math.random() - 0.5) * 200,
                            magnitude: Math.random() * 6 + 1,
                            spectral_class: ['O', 'B', 'A', 'F', 'G', 'K', 'M'][Math.floor(Math.random() * 7)]
                        });
                    }
                    
                    logToConsole(`🎯 Creating test starfield with ${testStars.length} stars`);
                    threejsStarmap.createStars(testStars);
                    
                }, 1000);
                
            } catch (error) {
                logToConsole('❌ Error in starmap test: ' + error.message);
            }
        }
        
        // Override console.log to also show in our console
        const originalLog = console.log;
        const originalWarn = console.warn;
        const originalError = console.error;
        
        console.log = function(...args) {
            originalLog.apply(console, args);
            logToConsole(args.join(' '));
        };
        
        console.warn = function(...args) {
            originalWarn.apply(console, args);
            logToConsole('⚠️ ' + args.join(' '));
        };
        
        console.error = function(...args) {
            originalError.apply(console, args);
            logToConsole('❌ ' + args.join(' '));
        };
        
        // Initialize on page load
        document.addEventListener('DOMContentLoaded', () => {
            logToConsole('📄 Page loaded, Three.js test ready');
        });
    </script>
</body>
</html>
